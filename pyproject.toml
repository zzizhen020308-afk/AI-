[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-loop"
version = "0.1.0"
description = "人机往返式的长篇小说写作引擎：起草 → 自评 → 反馈 → 修订 → 定稿"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zizhen.zhang" }]
keywords = ["writing", "novel", "llm", "human-in-the-loop"]
dependencies = []

[project.scripts]
novel = "novel_loop.cli:main"

[tool.setuptools]
packages = ["novel_loop"]

[tool.setuptools.package-data]
novel_loop = ["py.typed"]
